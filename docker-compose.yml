services:
  tail-sampling:
    build: .
    image: tail-sampling-workbench:latest
    container_name: tail-sampling-workbench
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/tracing.db
    volumes:
      - tracing-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  tracing-data:
